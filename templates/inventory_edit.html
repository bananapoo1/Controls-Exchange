{% extends "base.html" %}{% block title %}Edit inventory — Controls Exchange{% endblock %}{% block content %}<main class="auth-page"><div class="auth-card auth-card-wide"><span class="kicker">INVENTORY</span><h1>Edit stock line</h1><p>Changes are recorded in your company audit log.</p><form method="post" action="/inventory/{{ item.id }}/edit"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="two-col"><label>Manufacturer / brand<input name="brand" value="{{ item.brand }}"></label><label>Part number<input name="part_number" value="{{ item.part_number }}" required></label></div><label>Description<input name="description" value="{{ item.description }}"></label><div class="two-col"><label>Condition<input name="condition" value="{{ item.condition }}"></label><label>Quantity<input name="quantity" type="number" min="0" value="{{ item.quantity }}"></label></div><label>Stock location<input name="location" value="{{ item.location }}"></label><div class="form-actions"><a class="button button-outline" href="/inventory">Cancel</a><button class="button button-primary" type="submit">Save changes</button></div></form></div></main>{% endblock %}
